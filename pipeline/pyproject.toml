[project]
name = "sillon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sillon = "sillon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sillon"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
